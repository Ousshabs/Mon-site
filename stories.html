<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histoires — Admin OussHabs</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <div class="admin-logo">OussHabs</div>
            <div class="admin-logo-sub">Administration</div>
            <nav class="admin-nav">
                <a href="dashboard.html"><span class="dot"></span> Tableau de bord</a>
                <a href="stories.html"><span class="dot"></span> Histoires</a>
                <a href="users.html"><span class="dot"></span> Utilisateurs</a>
                <a href="messages.html"><span class="dot"></span> Messages</a>
            </nav>
            <div class="admin-sidebar-footer">
                <a href="../index.html" class="admin-view-site">← Voir le site</a>
                <button class="admin-logout" data-admin-logout>Déconnexion</button>
            </div>
        </aside>

        <main class="admin-main">
            <div class="admin-topbar">
                <div>
                    <h1>Histoires</h1>
                    <p>Gère les histoires publiées sur le site.</p>
                </div>
                <a href="story-form.html"><button class="btn">+ Nouvelle histoire</button></a>
            </div>

            <div class="admin-panel">
                <div class="admin-panel-head">
                    <h2>Toutes les histoires</h2>
                    <input type="text" class="admin-search" placeholder="Rechercher..." data-story-search>
                </div>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr><th>Titre</th><th>Catégorie</th><th>Auteur</th><th>Vues</th><th>Créée le</th><th>Actions</th></tr>
                        </thead>
                        <tbody data-stories-body></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="../db.js"></script>
    <script src="admin.js"></script>
</body>
</html>
