<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Admin OussHabs</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
    <div class="admin-shell">
        <aside class="admin-sidebar">
            <div class="admin-logo">OussHabs</div>
            <div class="admin-logo-sub">Administration</div>
            <nav class="admin-nav">
                <a href="dashboard.html"><span class="dot"></span> Tableau de bord</a>
                <a href="stories.html"><span class="dot"></span> Histoires</a>
                <a href="users.html"><span class="dot"></span> Utilisateurs</a>
                <a href="messages.html"><span class="dot"></span> Messages</a>
            </nav>
            <div class="admin-sidebar-footer">
                <a href="../index.html" class="admin-view-site">← Voir le site</a>
                <button class="admin-logout" data-admin-logout>Déconnexion</button>
            </div>
        </aside>

        <main class="admin-main">
            <div class="admin-topbar">
                <div>
                    <h1>Messages</h1>
                    <p>Messages reçus via le formulaire de contact du site.</p>
                </div>
            </div>

            <div class="categories" style="margin-bottom: 24px;">
                <button class="cat-pill active" data-message-filter="all">Tous</button>
                <button class="cat-pill" data-message-filter="unread">Non lus</button>
            </div>

            <div data-messages-list></div>
        </main>
    </div>

    <script src="../db.js"></script>
    <script src="admin.js"></script>
</body>
</html>
