<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion admin — Chroniques d'OussHabs</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
    <div class="admin-login-wrap">
        <div class="admin-login-card">
            <div class="admin-logo">Chroniques d'OussHabs</div>
            <div class="admin-logo-sub">Panneau d'administration</div>

            <div class="admin-error"></div>

            <form data-admin-login>
                <div class="field">
                    <label for="admin-email">Adresse e-mail</label>
                    <input type="email" id="admin-email" placeholder="admin@chroniques-ousshabs.fr" required>
                </div>
                <div class="field">
                    <label for="admin-password">Mot de passe</label>
                    <input type="password" id="admin-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="form-submit">Se connecter</button>
            </form>

            <p class="admin-hint">
                Démo — identifiants de test :<br>
                <strong>admin@chroniques-ousshabs.fr</strong> / <strong>admin123</strong>
            </p>
        </div>
    </div>

    <script src="../db.js"></script>
    <script src="admin.js"></script>
</body>
</html>
